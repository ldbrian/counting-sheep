<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>数羊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080c18;font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none;-webkit-user-select:none}
#world{position:relative;width:100%;height:100%;overflow:hidden;transition:background 3s}
#world::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:16px 16px;pointer-events:none;z-index:0}
#box{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);width:120px;height:auto;image-rendering:pixelated;z-index:2;transition:opacity 3s}
.creature{position:absolute;image-rendering:pixelated;z-index:1;transition:none}
#title{position:absolute;top:16px;width:100%;text-align:center;z-index:10}
#title h1{color:rgba(255,255,255,.6);font-size:36px;font-weight:400;letter-spacing:4px;margin:0}
#title p{color:rgba(255,255,255,.2);font-size:13px;margin-top:6px;letter-spacing:1px}
#hint{position:absolute;bottom:3%;width:100%;text-align:center;color:rgba(255,255,255,.15);font-size:13px;letter-spacing:1px;transition:opacity 1s}
#doneBtn{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.3);font-size:13px;padding:6px 16px;cursor:pointer;border-radius:20px;z-index:10;transition:opacity 1s,visibility 1s}
#doneBtn:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.5)}
#confess{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column}
#confess.show{display:flex}
#confessBox{background:rgba(8,12,24,.95);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:30px 40px;text-align:center}
#confessBox p{color:rgba(255,255,255,.5);font-size:15px;margin-bottom:20px}
#confessInput{background:none;border:none;border-bottom:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);font-size:28px;text-align:center;width:120px;outline:none;font-family:inherit}
#confessInput::placeholder{color:rgba(255,255,255,.2)}
#confessReply{color:rgba(255,255,255,.45);font-size:16px;margin-top:24px;min-height:24px;transition:opacity 2s}
#confessClose{margin-top:20px;background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.3);font-size:12px;padding:5px 14px;cursor:pointer;border-radius:16px;opacity:0;transition:opacity 1s}
#confessOk{margin-top:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.5);font-size:14px;padding:6px 28px;cursor:pointer;border-radius:20px;transition:border-color .2s,color .2s}
#confessOk:hover{border-color:rgba(255,255,255,.5);color:rgba(255,255,255,.7)}
#restart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.3);font-size:14px;padding:8px 24px;cursor:pointer;border-radius:20px;z-index:10;opacity:0;transition:opacity 2s;visibility:hidden}
#restart:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.5)}
#permModal{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(0,0,0,.5)}
#permModal.show{display:flex}
#permBox{background:rgba(12,16,28,.97);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:32px 36px;text-align:center;max-width:320px}
#permBox h3{color:rgba(255,255,255,.6);font-size:18px;font-weight:400;margin:0 0 16px;letter-spacing:2px}
#permBox p{color:rgba(255,255,255,.35);font-size:13px;line-height:1.8;margin:0 0 24px}
#permBox .perm-btns{display:flex;gap:12px;justify-content:center}
#permBox .perm-btns button{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.45);font-size:13px;padding:7px 24px;cursor:pointer;border-radius:20px;transition:border-color .2s,color .2s}
#permBox .perm-btns button:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.65)}
#permBox .perm-btns .perm-allow{background:rgba(255,255,255,.08)}
#eventText{position:absolute;bottom:42%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-size:14px;letter-spacing:1px;white-space:nowrap;z-index:10;opacity:0;transition:opacity .6s,transform .6s;pointer-events:none}
#eventText.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
</style>
</head>
<body>
<div id="world">
  <div id="title"><h1>数羊</h1><p>你负责数，它负责让你数不清</p></div>
  <img id="box" src="assets/box.png" alt="">
  <div id="eventText"></div>
  <div id="hint">左右快速甩鼠标 / 手指在屏幕上快速左右滑动</div>
  <button id="doneBtn">就数到这里吧</button>
  <button id="restart">再来一次</button>
</div>
<div id="confess">
  <div id="confessBox">
    <p>你数到了几只？</p>
    <input id="confessInput" type="number" placeholder="?" autocomplete="off">
    <div id="confessReply"></div>
    <button id="confessOk">确定</button>
    <button id="confessClose">好</button>
  </div>
</div>
<div id="permModal">
  <div id="permBox">
    <h3>摇一摇</h3>
    <p>这个游戏可以通过摇手机来召唤羊<br>需要授权传感器权限<br><br>如果拒绝，也可以用手指<br>在屏幕上左右滑动</p>
    <div class="perm-btns">
      <button class="perm-allow" id="permAllow">允许</button>
      <button id="permDeny">不用了</button>
    </div>
  </div>
</div>
<script>
(function(){
  var world = document.getElementById('world');
  var boxEl = document.getElementById('box');
  var hintEl = document.getElementById('hint');
  var doneBtn = document.getElementById('doneBtn');
  var confess = document.getElementById('confess');
  var confessInput = document.getElementById('confessInput');
  var confessReply = document.getElementById('confessReply');
  var confessClose = document.getElementById('confessClose');
  var confessOk = document.getElementById('confessOk');
  var restartBtn = document.getElementById('restart');
  var eventTextEl = document.getElementById('eventText');
  var eventTextTimer = null;

  // ===== 素材库（加新素材只需加一行）=====
  var SPECIES = {
    sheep: {
      imgs: ['assets/sheep_1.png', 'assets/sheep_2.png'],
      w: 430, h: 286, chance: 0.88
    },
    wolf: {
      imgs: ['assets/wolf_1.png', 'assets/wolf_2.png'],
      w: 430, h: 286, chance: 0.07
    },
    goose: {
      imgs: ['assets/goose_1.png', 'assets/goose_2.png'],
      w: 384, h: 306, chance: 0.05, flipX: true
    }
  };

  var creatures = [];
  var creatureId = 0;
  var gameOver = false;
  var totalShakes = 0;

  var SHAKE_DIST = 80;
  var SHAKE_COOLDOWN = 800;

  var lastPointerX = null;
  var shakeAccum = 0;
  var lastShakeT = 0;
  var shakeCount = 0;
  var shakeCountReset = null;
  var SHAKE_THRESHOLD = 5;
  var motionSupported = false;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function bustUrl(url) { return url + '?t=' + Date.now() + Math.random(); }

  function getBoxRect() {
    var r = boxEl.getBoundingClientRect();
    return { cx: r.left + r.width / 2, top: r.top, bottom: r.bottom, width: r.width };
  }

  function showEventText(text) {
    if (eventTextTimer) clearTimeout(eventTextTimer);
    eventTextEl.textContent = text;
    eventTextEl.classList.remove('show');
    void eventTextEl.offsetWidth;
    eventTextEl.classList.add('show');
    eventTextTimer = setTimeout(function() {
      eventTextEl.classList.remove('show');
    }, 2500);
  }

  function pickSpecies() {
    var r = Math.random(), acc = 0;
    for (var k in SPECIES) {
      acc += SPECIES[k].chance;
      if (r < acc) return k;
    }
    return 'sheep';
  }

  function createCreature(opts) {
    if (gameOver) return;
    var activeCount = 0;
    for (var i = 0; i < creatures.length; i++) {
      if (creatures[i].alive) activeCount++;
    }
    if (activeCount >= MAX_CREATURES) return;
    opts = opts || {};
    var box = getBoxRect();
    var species = opts.species || pickSpecies();
    var sp = SPECIES[species];
    var dir = opts.dir != null ? opts.dir : (Math.random() < 0.5 ? -1 : 1);
    var speed = opts.speed || rand(40, 80);
    var baseScale = isMobile() ? rand(0.09, 0.14) : rand(0.15, 0.22);
    var scale = opts.scale || baseScale;

    var el = document.createElement('img');
    el.src = bustUrl(sp.imgs[0]);
    el.className = 'creature';
    el.style.width = (sp.w * scale) + 'px';
    el.style.position = 'absolute';
    world.appendChild(el);

    var cw = sp.w * scale;
    var ch = sp.h * scale;
    var groundY = box.bottom - ch - 10;

    var c = {
      id: creatureId++,
      el: el,
      x: opts.startX != null ? opts.startX : box.cx - cw / 2,
      y: opts.startY != null ? opts.startY : box.top - ch * 0.3,
      dir: dir,
      speed: speed,
      scale: scale,
      state: opts.state || 'popping',
      popT: 0,
      popDur: 500 + Math.random() * 300,
      vx: dir * rand(30, 60),
      frame: 0,
      frameTimer: 0,
      alive: true,
      groundY: groundY,
      species: species,
      imgs: sp.imgs,
      cw: cw,
      ch: ch,
      turned: false,
      turnTimer: 0,
      turnDelay: rand(2000, 6000),
      returning: false,
      returnPhase: 0,
      returnTimer: 0
    };

    creatures.push(c);
    return c;
  }

  function onShake() {
    if (gameOver) return;
    var now = Date.now();
    if (now - lastShakeT < SHAKE_COOLDOWN) return;
    lastShakeT = now;

    totalShakes++;
    var spawnChance = 1 / (1 + totalShakes * 0.03);
    var darkness = Math.min(0.35, Math.log(1 + totalShakes) * 0.06);
    world.style.filter = 'brightness(' + (1 - darkness) + ')';

    shakeCount++;
    if (shakeCountReset) clearTimeout(shakeCountReset);
    shakeCountReset = setTimeout(function() { shakeCount = 0; }, 3000);
    if (shakeCount >= 5) {
      showEventText('慢点数');
      shakeCount = 0;
    }

    if (Math.random() < spawnChance) {
      var n = randInt(1, 3);
      var count = Math.max(1, Math.round(n * spawnChance));
      for (var i = 0; i < count; i++) {
        (function(delay) {
          setTimeout(function() {
            var c = createCreature();
            if (c && c.species === 'wolf') showEventText('咦 好像有什么东西混在羊群里');
            else if (c && c.species === 'goose') showEventText('这不是羊吧…');
          }, delay);
        })(i * 250);
      }
    } else {
      showEventText(['…', '嗯？', '空的', '什么都没有'][randInt(0, 3)]);
    }
  }

  // ===== 摇手机检测 =====
  var motionReady = false;
  var permModal = document.getElementById('permModal');
  var permAllow = document.getElementById('permAllow');
  var permDeny = document.getElementById('permDeny');

  function onDeviceMotion(e) {
    if (gameOver) return;
    var acc = e.acceleration || e.accelerationIncludingGravity;
    if (!acc) return;
    var total = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
    if (total > SHAKE_THRESHOLD) {
      onShake();
    }
  }

  function doRequestMotion() {
    if (motionReady) return;
    if (!window.DeviceMotionEvent) return;
    motionSupported = true;

    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(function(state) {
        if (state === 'granted') {
          motionReady = true;
          window.addEventListener('devicemotion', onDeviceMotion);
        }
        updateHint();
      }).catch(function() {
        updateHint();
      });
    } else {
      motionReady = true;
      window.addEventListener('devicemotion', onDeviceMotion);
    }
  }

  permAllow.addEventListener('click', function() {
    permModal.classList.remove('show');
    doRequestMotion();
  });

  permDeny.addEventListener('click', function() {
    permModal.classList.remove('show');
  });

  function onFirstInteraction() {
    if (!window.DeviceMotionEvent) return;
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      permModal.classList.add('show');
    } else {
      motionReady = true;
      window.addEventListener('devicemotion', onDeviceMotion);
    }
    document.removeEventListener('touchstart', onFirstInteraction);
    document.removeEventListener('click', onFirstInteraction);
  }

  document.addEventListener('touchstart', onFirstInteraction, { once: true, passive: true });
  document.addEventListener('click', onFirstInteraction, { once: true });

  function isMobile() {
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  }
  var MAX_CREATURES = 5;

  function updateHint() {
    if (isMobile() && motionSupported) {
      hintEl.textContent = '摇一摇手机';
    } else {
      hintEl.textContent = '左右快速甩鼠标';
    }
  }

  updateHint();

  world.addEventListener('pointermove', function(e) {
    if (gameOver) return;
    if (lastPointerX === null) { lastPointerX = e.clientX; return; }
    var dx = Math.abs(e.clientX - lastPointerX);
    lastPointerX = e.clientX;
    shakeAccum += dx;
    if (shakeAccum >= SHAKE_DIST) {
      shakeAccum = 0;
      onShake();
    }
  });

  world.addEventListener('pointerdown', function() {
    if (gameOver) return;
  });

  var REPLY_POOL = [
    '嗯。','好。','原来如此。','记下了。','是吗。',
    '然后呢。','哦。','知道了。','行吧。','也行。'
  ];

  doneBtn.addEventListener('click', function() {
    if (gameOver) return;
    gameOver = true;
    hintEl.style.opacity = '0';
    doneBtn.style.opacity = '0';
    setTimeout(function() { doneBtn.style.visibility = 'hidden'; }, 1000);
    confess.classList.add('show');
    setTimeout(function() { confessInput.focus(); }, 300);
  });

  function submitCount() {
    var val = parseInt(confessInput.value);
    if (isNaN(val)) val = '?';
    var reply = REPLY_POOL[randInt(0, REPLY_POOL.length - 1)];
    confessReply.textContent = val + '。' + reply;
    confessInput.style.opacity = '0';
    confessInput.disabled = true;
    confessOk.style.display = 'none';
    setTimeout(function() { confessClose.style.opacity = '1'; }, 1500);
    startFadeOut();
  }

  confessInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitCount();
  });

  confessOk.addEventListener('click', function() {
    if (!confessInput.disabled) submitCount();
  });

  confessClose.addEventListener('click', function() {
    confess.classList.remove('show');
    setTimeout(function() {
      restartBtn.style.visibility = 'visible';
      restartBtn.style.opacity = '1';
    }, 2000);
  });

  restartBtn.addEventListener('click', function() {
    for (var i = creatures.length - 1; i >= 0; i--) {
      creatures[i].alive = false;
      creatures[i].el.remove();
    }
    creatures = [];
    creatureId = 0;
    gameOver = false;
    boxEl.style.display = '';
    boxEl.style.opacity = '';
    world.style.background = '';
    world.style.filter = '';
    totalShakes = 0;
    hintEl.style.opacity = '';
    doneBtn.style.visibility = '';
    doneBtn.style.opacity = '';
    confessInput.value = '';
    confessInput.style.opacity = '';
    confessInput.disabled = false;
    confessOk.style.display = '';
    confessReply.textContent = '';
    confessClose.style.opacity = '0';
    restartBtn.style.opacity = '0';
    restartBtn.style.visibility = 'hidden';
    eventTextEl.classList.remove('show');
    if (eventTextTimer) clearTimeout(eventTextTimer);
    shakeCount = 0;
  });

  function startFadeOut() {
    eventTextEl.classList.remove('show');
    if (eventTextTimer) clearTimeout(eventTextTimer);
    boxEl.style.opacity = '0';
    setTimeout(function() { boxEl.style.display = 'none'; }, 3000);
    world.style.background = '#050810';
    for (var i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      if (c.alive) {
        c.el.style.transition = 'opacity 4s';
        c.el.style.opacity = '0';
        (function(cr) {
          setTimeout(function() { cr.alive = false; cr.el.remove(); }, 4200);
        })(c);
      }
    }
  }

  // ===== 主循环 =====
  var lastTime = 0;

  function update(now) {
    var dt = lastTime ? (now - lastTime) : 16;
    lastTime = now;
    var screenW = window.innerWidth;

    for (var i = creatures.length - 1; i >= 0; i--) {
      var c = creatures[i];
      if (!c.alive) continue;

      if (c.state === 'popping') {
        c.popT += dt;
        var t = Math.min(c.popT / c.popDur, 1);
        var arc = Math.sin(t * Math.PI);
        c.x = (getBoxRect().cx - c.cw / 2) + c.vx * t * 2;
        c.y = c.groundY + arc * -160;
        if (t >= 0.4 && t < 0.42) c.el.src = bustUrl(c.imgs[1]);
        if (t >= 1) {
          c.state = 'walking';
          c.y = c.groundY;
          c.vx = 0;
        }
      } else if (c.state === 'walking') {
        c.x += c.dir * c.speed * dt / 1000;

        c.frameTimer += dt;
        if (c.frameTimer > 150) {
          c.frameTimer -= 150;
          c.frame = 1 - c.frame;
            c.el.src = bustUrl(c.frame === 0 ? c.imgs[0] : c.imgs[1]);
        }

        if (c.species === 'sheep' && !c.turned && !c.returning && !gameOver) {
          c.turnTimer += dt;
          var returnAge = c.turnTimer - c.turnDelay;
          var returnChance = returnAge > 0 ? Math.min(0.08, 0.005 + returnAge * 0.00003) : 0;
          if (returnAge > 0 && Math.random() < returnChance * dt / 1000) {
            c.turned = true;
            c.returning = true;
            c.state = 'returning';
            c.dir = c.x > getBoxRect().cx ? -1 : 1;
            showEventText(Math.random() < 0.5 ? '有只羊跳回去了' : '刚才那只不算吧');
          }
        }

      } else if (c.state === 'returning') {
        var box = getBoxRect();
        var targetX = box.cx - c.cw / 2;
        var distToBox = c.x - targetX;

        if (c.returnPhase === 0) {
          c.x += c.dir * c.speed * 1.2 * dt / 1000;
          c.frameTimer += dt;
          if (c.frameTimer > 120) {
            c.frameTimer -= 120;
            c.frame = 1 - c.frame;
            c.el.src = bustUrl(c.frame === 0 ? c.imgs[0] : c.imgs[1]);
          }
          if (Math.abs(distToBox) < 15) {
            c.returnPhase = 1;
            c.returnTimer = 0;
            c.y = c.groundY;
          }
        } else if (c.returnPhase === 1) {
          c.returnTimer += dt;
          var t = Math.min(c.returnTimer / 500, 1);
          var arc = Math.sin(t * Math.PI);
          c.x = targetX;
          c.y = c.groundY + arc * -180;
          if (t >= 0.3 && t < 0.32) c.el.src = bustUrl(c.imgs[1]);
          if (t >= 1) {
            c.alive = false;
            c.el.remove();
          }
        }
      }

      if (c.alive) {
        c.el.style.left = c.x + 'px';
        c.el.style.top = c.y + 'px';
        var shouldFlip = SPECIES[c.species].flipX ? c.dir > 0 : c.dir < 0;
        c.el.style.transform = shouldFlip ? 'scaleX(-1)' : '';
      }
    }

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
})();
</script>
</body>
</html>
